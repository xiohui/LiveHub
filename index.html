<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="description" content="集合 · 生活、运动、学习一体化管理。待办、Vlog、运动打卡、读书进度与资料收藏，数据本地保存。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<title>集合</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="phone">
  <div id="app"><div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:14px;">加载中…</div></div>

  <nav id="bottom-nav">
    <button class="nav-item active" data-page="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>首页</span>
    </button>
    <button class="nav-item" data-page="life">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span>生活</span>
      <span id="life-badge" class="badge"></span>
    </button>
    <button class="nav-item" data-page="sport">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>运动</span>
    </button>
    <button class="nav-item" data-page="learn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      <span>学习</span>
    </button>
  </nav>
</div>

<script>
// 强制更新 Service Worker：卸载旧 SW → 刷新页面 → 注册新版本
if ('serviceWorker' in navigator) {
  (async () => {
    const regs = await navigator.serviceWorker.getRegistrations();
    if (regs.length > 0 && !sessionStorage.getItem('lh_sw_v8')) {
      sessionStorage.setItem('lh_sw_v8', '1');
      await Promise.all(regs.map(r => r.unregister()));
      location.reload();
    }
  })();
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js?v=8').catch(() => {});
  });
  // SW activate 阶段会通过 clients.navigate() 自动刷新所有页面，无需 controllerchange 监听
}
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
