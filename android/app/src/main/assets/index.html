<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="description" content="集合 · 生活、运动、学习一体化管理。待办、Vlog、运动打卡、读书进度与资料收藏，数据本地保存。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<title>集合</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="phone">
  <div id="app"><div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:14px;">加载中…</div></div>

  <nav id="bottom-nav">
    <button class="nav-item active" data-page="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.2 12 3l9 7.2"/><path d="M5.2 9.3V20a1 1 0 0 0 1 1h11.6a1 1 0 0 0 1-1V9.3"/><path d="M9.3 21v-6.2a1 1 0 0 1 1-1h3.4a1 1 0 0 1 1 1V21"/></svg>
      <span>首页</span>
    </button>
    <button class="nav-item" data-page="life">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
      <span>生活</span>
      <span id="life-badge" class="badge"></span>
    </button>
    <button class="nav-item" data-page="sport">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.2v5.6"/><path d="M6.4 7.2v9.6"/><path d="M17.6 7.2v9.6"/><path d="M20 9.2v5.6"/><path d="M6.4 12h11.2"/></svg>
      <span>运动</span>
    </button>
    <button class="nav-item" data-page="learn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.5C9.8 4.3 6.8 4 4 4.4v13.4c2.8-.4 5.8-.1 8 1.1"/><path d="M12 5.5c2.2-1.2 5.2-1.5 8-1.1v13.4c-2.8-.4-5.8-.1-8 1.1"/><line x1="12" y1="5.5" x2="12" y2="18.9"/></svg>
      <span>学习</span>
    </button>
  </nav>
</div>

<script>
// 强制更新 Service Worker：卸载旧 SW → 刷新页面 → 注册新版本
if ('serviceWorker' in navigator) {
  (async () => {
    const regs = await navigator.serviceWorker.getRegistrations();
    if (regs.length > 0 && !sessionStorage.getItem('lh_sw_v8')) {
      sessionStorage.setItem('lh_sw_v8', '1');
      await Promise.all(regs.map(r => r.unregister()));
      location.reload();
    }
  })();
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js?v=8').catch(() => {});
  });
  // SW activate 阶段会通过 clients.navigate() 自动刷新所有页面，无需 controllerchange 监听
}
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
